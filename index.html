<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoey Solomon</title>
    <link rel="canonical" href="https://zolomon.studio/">
    <meta name="description" content="Zoey Solomon is a multidisciplinary artist working in botanical scanography, experimental video, and drawing, with archival fine art prints made from real flowers. Based in the Washington, DC area.">
    <meta property="og:title" content="Zoey Solomon">
    <meta property="og:description" content="Multidisciplinary artist working in botanical scanography, experimental video, and drawing.">
    <meta property="og:url" content="https://zolomon.studio/">
    <meta property="og:type" content="website">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #d4d0c8;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: none;
  }

  /* Custom cursor */
  #cursor {
    position: fixed;
    width: 8px;
    height: 8px;
    background: #d4d0c8;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease, opacity 0.3s ease;
    mix-blend-mode: difference;
  }

  /* Hero */
  #hero {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  #hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    transition: opacity 1.8s ease;
  }

  #hero-img.loaded { opacity: 1; }

  /* Overlay: very subtle dark vignette */
  #hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(10,10,10,0.55) 100%);
    pointer-events: none;
  }

  /* Swiss grid nav — top bar */
  nav {
    position: fixed;
    z-index: 100;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 1.5rem 2.6rem;

    mix-blend-mode: difference;
  }

  .site-name { display: Zoey Solomon Art; }

  .nav-links {
    display: flex;
    gap: 2.8rem;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #f0ece2;
    text-decoration: none;
    font-weight: 500;
    opacity: 1;
    transition: opacity 0.25s;
  }

  .nav-links a:hover { opacity: 0.6; }

  /* Swiss hero type block — bottom anchored */
  #hero-type {
    position: fixed;
    z-index: 100;
    bottom: 0; left: 0; right: 0;
    padding: 0 2.4rem 2.2rem;
    mix-blend-mode: difference;
    pointer-events: none;
  }

  #hero-type .rule-top {
    display: none;
  }

  #hero-type .name-block {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    line-height: 0.88;
  }

  #hero-type .name-first {
    font-size: clamp(5rem, 13vw, 13rem);
    font-weight: 700;
    letter-spacing: -0.025em;
    text-transform: uppercase;
    color: #f0ece2;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    white-space: nowrap;
  }

  #hero-type .name-last {
    font-size: clamp(5rem, 13vw, 13rem);
    font-weight: 700;
    letter-spacing: -0.025em;
    text-transform: uppercase;
    color: #f0ece2;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    white-space: nowrap;
    text-align: right;
  }

  #hero-type .discipline-line {
    display: flex;
    justify-content: space-between;
    margin-top: 0.5rem;
  }

  #hero-type .discipline-line span {
    font-size: 0.58rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(240,236,226,0.45);
    font-weight: 400;
  }

  /* Index counter — hidden, folded into hero-type */
  #index-display { display: none; }

  /* Arrow nav — top left corner, minimal */
  #arrow-nav {
    position: fixed;
    top: 1.2rem;
    left: 2.6rem;
    z-index: 100;
    display: flex;
    gap: 1.4rem;
    mix-blend-mode: difference;
  }

  .arrow-btn {
    background: none;
    border: none;
    color: rgba(240,236,226,0.4);
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    cursor: none;
    padding: 0;
    text-transform: uppercase;
    transition: color 0.25s;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    mix-blend-mode: difference;
  }

  .arrow-btn:hover { color: #f0ece2; }

  .arrow-btn:hover { color: #f0ece2; }

  /* Works overlay */
  #works-overlay {
    position: fixed;
    inset: 0;
    background: #f0ece4;
    z-index: 200;
    overflow-y: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  #works-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .works-header {
    position: sticky;
    top: 0;
    background: #f0ece4;
    padding: 1.8rem 3rem 1.4rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    z-index: 10;
  }

  .works-title {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #2a2a2a;
    font-weight: 400;
  }

  .close-btn {
    background: none;
    border: none;
    color: #999;
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: none;
    padding: 0;
    transition: color 0.3s;
    font-family: inherit;
  }

  .close-btn:hover { color: #2a2a2a; }

  .works-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    padding: 0 2rem 4rem;
    background: #f0ece4;
  }

  .work-item {
    padding: 1.6rem 1rem 2.4rem;
    cursor: none;
    position: relative;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .work-item-img-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.9rem;
  }

  .work-item img {
    max-width: 100%;
    max-height: 340px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    opacity: 1;
    transition: opacity 0.35s ease;
    box-shadow: 0 2px 18px rgba(0,0,0,0.10);
  }

  .work-item:hover img {
    opacity: 0.88;
  }

  .work-caption {
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #aaa;
    text-align: center;
    font-weight: 400;
    margin-top: 0.2rem;
  }

  /* About overlay */
  #about-overlay {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 12vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  #about-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .about-inner {
    max-width: 520px;
  }

  .about-inner h2 {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #f0ece2;
    margin-bottom: 2.8rem;
    font-weight: 400;
  }

  .about-inner p {
    font-size: 0.88rem;
    line-height: 1.85;
    color: #9a9690;
    font-weight: 300;
    margin-bottom: 1.6rem;
  }

  .about-inner .contact-line {
    margin-top: 3.2rem;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #666;
  }

  .about-close {
    position: fixed;
    top: 2.2rem;
    right: 2.8rem;
    background: none;
    border: none;
    color: #666;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: none;
    transition: color 0.3s;
  }

  .about-close:hover { color: #f0ece2; }
</style>
</head>
<body>

<div id="cursor"></div>

<!-- Hero -->
<section id="hero">
  <img id="hero-img" src="" alt="Zoey Solomon — Visual Art">
</section>

<!-- Navigation top bar -->
<nav>
  <ul class="nav-links">
    <li><a href="#" onclick="openWorks(); return false;">Visual Art</a></li>
    <li><a href="#" onclick="openAbout(); return false;">About</a></li>
    <li><a href="#" onclick="openVideowork(); return false;">Video</a></li>
    <li><a href="#" onclick="openContact(); return false;">Contact</a></li>
  </ul>
</nav>

<div id="index-display">01 / 23</div>

<div id="arrow-nav">
  <button class="arrow-btn" onclick="prevImage()">←</button>
  <button class="arrow-btn" onclick="nextImage()">→</button>
</div>

<!-- Swiss ITS name block -->
<div id="hero-type">
  <div class="rule-top"></div>
  <div class="name-block">
    <span class="name-first">Zoey</span>
    <span class="name-last">Solomon</span>
  </div>
  <div class="discipline-line">
    <span>Visual Artist</span>
    <span id="slide-counter">01 — 23</span>
  </div>
</div>

<!-- Works overlay -->
<div id="works-overlay">
  <div class="works-header">
    <span class="works-title">Selected Works</span>
    <button class="close-btn" onclick="closeWorks()">Home</button>
  </div>
  <div class="works-grid" id="works-grid"></div>
</div>

<!-- About overlay
<div id="about-overlay">
  <button class="about-close" onclick="closeAbout()">Close</button>
  <div class="about-inner">
    <h2>About</h2>
    <p>Zoey Solomon is a visual artist working across photography, painting, and mixed media. Her practice explores the intersection of materiality, memory, and the body — tracing traces left behind in objects, spaces, and skin.</p>
    <p>Her work has been exhibited in independent and institutional contexts, engaging questions of presence, intimacy, and the archive.</p>
    <p class="contact-line">Available for exhibition &amp; commissions</p>
  </div>
</div> -->

<script>
const IMAGES = {
  "image1.jpg": "assets/scan/eaa16ac84aff.jpg",
  "image10.jpg": "assets/scan/7dd34a4653d2.jpg",
  "image11.jpg": "assets/scan/1992840b8010.jpg",
  "image12.jpg": "assets/scan/b74031e4df7d.jpg",
  "image13.jpg": "assets/scan/a95fa0dd33b2.jpg",
  "image14.jpg": "assets/scan/975d18f9fed7.jpg",
  "image15.jpg": "assets/scan/26d0f2b5a20c.jpg",
  "image16.jpg": "assets/scan/1abb63ec2edf.jpg",
  "image17.jpg": "assets/scan/b9689a055293.jpg",
  "image18.jpg": "assets/scan/1c1dbb2d739e.jpg",
  "image19.jpg": "assets/scan/3ed599f0cbfa.jpg",
  "image2.jpg": "assets/scan/cb7f2ba679de.jpg",
  "image20.jpg": "assets/scan/159b26b21c5a.jpg",
  "image21.jpg": "assets/scan/8439ddcab682.jpg",
  "image22.jpg": "assets/scan/9ac3ca580f9d.jpg",
  "image23.jpg": "assets/scan/6ca2874d2585.jpg",
  "image24.jpg": "assets/scan/a19b364e0f74.jpg",
  "image3.jpg": "assets/scan/55be5a974fd8.jpg",
  "image4.jpg": "assets/scan/3b8811843442.jpg",
  "image5.jpg": "assets/scan/20971f376af4.jpg",
  "image6.jpg": "assets/scan/4bd8202ec42d.jpg",
  "image8.jpg": "assets/scan/9f915fbcfecf.jpg",
  "image9.jpg": "assets/scan/0b1ede456e72.jpg"
};

const keys = Object.keys(IMAGES);
let current = 0;

function showImage(index) {
  const img = document.getElementById('hero-img');
  img.classList.remove('loaded');
  setTimeout(() => {
    img.src = IMAGES[keys[index]];
    img.onload = () => img.classList.add('loaded');
  }, 200);
  const counter = document.getElementById('slide-counter');
  if (counter) counter.textContent =
    String(index + 1).padStart(2, '0') + ' — ' + String(keys.length).padStart(2, '0');
}

function nextImage() {
  current = (current + 1) % keys.length;
  showImage(current);
}

function prevImage() {
  current = (current - 1 + keys.length) % keys.length;
  showImage(current);
}

// Auto-advance every 7s
let autoTimer = setInterval(nextImage, 7000);

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { clearInterval(autoTimer); nextImage(); autoTimer = setInterval(nextImage, 7000); }
  if (e.key === 'ArrowLeft') { clearInterval(autoTimer); prevImage(); autoTimer = setInterval(nextImage, 7000); }
  // if (e.key === 'Escape') { closeWorks(); closeAbout(); }
});

// Works grid
function openWorks() {
  const grid = document.getElementById('works-grid');
  if (!grid.children.length) {
    keys.forEach((k, i) => {
      const div = document.createElement('div');
      div.className = 'work-item';

      const wrap = document.createElement('div');
      wrap.className = 'work-item-img-wrap';

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = IMAGES[k];
      img.alt = 'Work ' + (i+1);

      const cap = document.createElement('div');
      cap.className = 'work-caption';
      cap.textContent = String(i + 1).padStart(2, '0');

      wrap.appendChild(img);
      div.appendChild(wrap);
      div.appendChild(cap);
      div.onclick = () => { current = i; showImage(i); closeWorks(); };
      grid.appendChild(div);
    });
  }
  document.getElementById('works-overlay').classList.add('open');
}

function closeWorks() {
  document.getElementById('works-overlay').classList.remove('open');
}

// function openAbout() {
//   document.getElementById('about-overlay').classList.add('open');
// }

// function closeAbout() {
//   document.getElementById('about-overlay').classList.remove('open');
// }

// Custom cursor
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});

// Init
showImage(0);


function openVideowork() {
  window.location.href = "videowork.html";
}

function openContact() {
  window.location.href = "contact.html";
}
function openAbout() {
  window.location.href = "about.html";
}
</script>
</body>
</html>
