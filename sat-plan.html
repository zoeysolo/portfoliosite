<!DOCTYPE html>
<html lang="en">
<head>

<title>SAT Plan: Sept 22 to Oct 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F8FC; --grid:rgba(52,96,170,.075); --card:#FFFFFF; --ink:#1B2640; --soft:#56627A; --line:#D7DFEC;
  --accent:#2C5BA6; --accent-ink:#FFFFFF; --hl:#FFE45C; --hl-ink:#302900; --go:#1B7A52; --go-bg:#E1F2E9;
  --oops:#A4455A; --oops-bg:#FBE9EE; --chip:#EDF2F9;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121A2B; --grid:rgba(143,178,240,.06); --card:#1A2439; --ink:#E7EDF8; --soft:#A7B4CA; --line:#2D3A55;
    --accent:#8DB0F0; --accent-ink:#0F1726; --hl:#F3D64A; --hl-ink:#2A2300; --go:#63CB98; --go-bg:#193629;
    --oops:#F294A8; --oops-bg:#3A2130; --chip:#222E47; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121A2B; --grid:rgba(143,178,240,.06); --card:#1A2439; --ink:#E7EDF8; --soft:#A7B4CA; --line:#2D3A55;
  --accent:#8DB0F0; --accent-ink:#0F1726; --hl:#F3D64A; --hl-ink:#2A2300; --go:#63CB98; --go-bg:#193629;
  --oops:#F294A8; --oops-bg:#3A2130; --chip:#222E47; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.top{max-width:1100px;margin:0 auto;padding:30px 20px 6px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5.2vw,3.2rem);line-height:1.02;letter-spacing:-.015em;margin:0 0 10px;max-width:16ch}
.sub{margin:0;color:var(--soft);max-width:62ch}
.sub strong{color:var(--ink)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:18px;border-bottom:1.5px solid var(--line)}
nav.tabs button{font:inherit;font-size:.95rem;background:none;border:none;color:var(--soft);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
nav.tabs .count{display:inline-block;min-width:1.5em;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--chip);color:var(--ink);font-size:.8rem;text-align:center}

.stripwrap{max-width:1100px;margin:0 auto;padding:0 20px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 12px;scroll-snap-type:x proximity}
.daychip{flex:0 0 auto;scroll-snap-align:start;min-width:96px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 11px 9px;position:relative}
.daychip:hover{border-color:var(--soft)}
.daychip .d{display:block;font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.2}
.daychip .t{display:block;font-size:.78rem;color:var(--soft);line-height:1.3;margin-top:2px}
.daychip[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.daychip.done{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.daychip.done .t{color:var(--hl-ink)}
.daychip.done[aria-current="true"]{border-color:var(--hl-ink);box-shadow:inset 0 0 0 1px var(--hl-ink)}
.daychip .today{position:absolute;top:-9px;right:8px;background:var(--ink);color:var(--paper);font-size:.68rem;padding:1px 7px;border-radius:999px}

main{max-width:1100px;margin:0 auto;padding:10px 20px 70px}
.day{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
.aside{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.when{margin:0 0 4px;color:var(--soft);font-size:.92rem}
.aside h2{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.1;margin:0 0 12px;letter-spacing:-.01em}
.goal{margin:0 0 10px}
.time{margin:0 0 14px;color:var(--soft);font-size:.92rem}
.objs{margin:0 0 18px;padding-left:1.1em}
.objs li{margin:3px 0}
.objlabel{font-weight:700;margin:0 0 4px;font-size:.95rem}
.bar{height:12px;background:var(--chip);border-radius:999px;overflow:hidden;margin:6px 0 6px}
.bar>span{display:block;height:100%;background:var(--hl);transition:width .35s ease}
.progtext{font-size:.9rem;color:var(--soft);margin:0 0 14px}
.stepindex{list-style:none;margin:0;padding:0}
.stepindex a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:5px 0;font-size:.95rem}
.stepindex .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--soft);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem}
.stepindex .isdone .mk{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.stepindex .opt{color:var(--soft)}
.celebrate{background:var(--hl);color:var(--hl-ink);border-radius:12px;padding:12px 14px;font-weight:700;margin:0 0 16px}
@media (prefers-reduced-motion: no-preference){.celebrate.pop{animation:pop .5s ease}}
@keyframes pop{0%{transform:scale(.94);opacity:0}60%{transform:scale(1.02);opacity:1}100%{transform:scale(1)}}

.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px;margin-bottom:16px}
.step.isdone{border-left:6px solid var(--hl)}
.stephead{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700}
.step.optional .num{background:var(--chip);color:var(--ink)}
.stephead h3{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:2px 0 0;line-height:1.2}
.stephead .st{font-size:.88rem;color:var(--soft)}
.stephead .grow{flex:1}
.donebtn{font:inherit;font-size:.88rem;border-radius:999px;padding:6px 13px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.donebtn[aria-pressed="true"]{background:var(--hl);border-color:var(--hl);color:var(--hl-ink);font-weight:700}

.vid{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.vid:hover{border-color:var(--accent)}
.play{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:1rem;padding-left:3px}
.vid strong{display:block;line-height:1.3}
.vid .src{display:block;font-size:.85rem;color:var(--soft)}
.note{margin:10px 0 0;font-size:.96rem}
.bonus{margin:12px 0 0;padding:0;list-style:none}
.bonus li{margin:6px 0}
.bonus .lbl{font-size:.9rem;color:var(--soft);margin:12px 0 2px}

.ideas{margin:0;padding-left:1.1em}
.ideas li{margin:7px 0}
.checklist{margin:0;padding-left:1.1em}
.checklist li{margin:7px 0}
details{border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--soft)}
.tag{font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink)}
.tag.eng{background:transparent;border:1.5px solid var(--line)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--soft);background:transparent;padding:0;cursor:pointer}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
.dot.ok{background:var(--go);border-color:var(--go)}
.dot.no{background:var(--oops);border-color:var(--oops)}
.passage{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:6px 0 12px;font-size:.98rem}
.tablewrap{overflow-x:auto;margin:6px 0 12px}
table.qt{border-collapse:collapse;font-size:.94rem;min-width:260px}
table.qt th,table.qt td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.qt th{background:var(--chip)}
.prompt{font-weight:700;margin:4px 0 10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.letter{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.choice.right{border-color:var(--go);background:var(--go-bg)}
.choice.right .letter{background:var(--go);border-color:var(--go);color:var(--card)}
.choice.wrong{border-color:var(--oops);background:var(--oops-bg)}
.choice.wrong .letter{background:var(--oops);border-color:var(--oops);color:var(--card)}
.numrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.numrow input{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:200px;max-width:100%}
.hint{font-size:.9rem;color:var(--oops);margin:6px 0 0;min-height:1em}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.97rem}
.fb.right{background:var(--go-bg)}
.fb.wrong{background:var(--oops-bg)}
.fb .saved{display:block;margin-top:6px;font-size:.88rem;color:var(--soft)}
.qnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-size:.95rem;border-radius:999px;padding:8px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.summary .big{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0 0 6px}

.fcmeta{font-size:.9rem;color:var(--soft);margin:0 0 10px}
.fc{display:block;width:100%;min-height:210px;position:relative;border:none;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;perspective:1200px}
.fc .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--paper);-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:transform .45s ease;font-size:1.12rem;overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--chip)}
.fc.flipped .front{transform:rotateY(-180deg)}
.fc.flipped .back{transform:rotateY(0)}
@media (prefers-reduced-motion: reduce){.fc .face{transition:none}}
.fc .side{position:absolute;top:10px;left:14px;font-size:.75rem;color:var(--soft)}
.fchint{font-size:.85rem;color:var(--soft);margin:8px 0 10px;text-align:center}
.fcctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fcctl .learn{border-color:var(--oops);color:var(--oops)}
.fcctl .know{border-color:var(--go);color:var(--go)}
.fcopts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:.9rem;align-items:center}
.fcopts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

.daynote{margin:6px 0 18px;padding:14px 16px;border-radius:12px;background:var(--chip);font-style:italic}
.daynav{display:flex;justify-content:space-between;gap:10px}

.page{max-width:720px}
.page h2{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:6px 0 10px;line-height:1.1}
.page h3{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:26px 0 6px}
.page p{margin:0 0 12px}
.scores{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 6px}
.score{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;min-width:200px}
.score .v{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.1}
.score .l{font-size:.9rem;color:var(--soft)}
.retrycard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.from{font-size:.88rem;color:var(--soft);margin:0 0 8px}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:22px}
form.noteform{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px;margin:12px 0 20px}
form.noteform label{display:grid;gap:4px;font-weight:700;font-size:.95rem}
form.noteform input,form.noteform select,form.noteform textarea{font:inherit;font-weight:400;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
form.noteform textarea{min-height:80px;resize:vertical}
.noteitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
.noteitem .nt{font-weight:700}
.noteitem .nm{font-size:.88rem;color:var(--soft)}
.noteitem p{margin:6px 0 8px}
.linkbtn{font:inherit;font-size:.88rem;background:none;border:none;color:var(--oops);cursor:pointer;padding:0;text-decoration:underline}
.pattern{background:var(--chip);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.small{font-size:.9rem;color:var(--soft)}

@media (max-width:860px){
  .day{grid-template-columns:1fr;gap:18px}
  .aside{position:static}
  .stepindex{display:none}
}
@media (max-width:520px){
  body{font-size:16px}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto}
  nav.tabs button{padding:10px 9px;white-space:nowrap}
  .step{padding:16px 15px 18px}
  .stephead{flex-wrap:wrap}
  .donebtn{margin-left:44px}
}
</style>
</head>
<body>
<header class="top">
  <h1>Eleven days, one step at a time</h1>
  <p class="sub" id="countdown"></p>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<div class="stripwrap"><div class="strip" id="strip" role="list" aria-label="Days of the plan"></div></div>
<main id="main"></main>

<script>
/* ---------- Plan content ---------- */
const STUDY_STEPS = [
  {type:"video", title:"Watch", time:"15-20 min"},
  {type:"learn", title:"Read the key ideas", time:"5 min"},
  {type:"practice", title:"Practice questions", time:"20 min"},
  {type:"cards", title:"Flashcards", time:"10 min"},
  {type:"more", title:"Want more? (optional)", time:"15 min", optional:true}
];

const DAYS = [
{
  id:"d1", date:"2026-09-22", dow:"Tue", dowLong:"Tuesday", md:"Sep 22", mdLong:"September 22", tab:"Lines",
  title:"Lines and linear functions",
  goal:"Read, write, and interpret the equation of a line, so slope, intercept, and word-problem questions feel familiar.",
  time:"About 60 minutes",
  objectives:["Find slope from two points, a table, or an equation","Explain what slope and y-intercept mean in a word problem","Turn a short word problem into y = mx + b"],
  video:{title:"SAT Math Full Review: Lines, Linear Functions, Linear Systems", url:"https://www.youtube.com/watch?v=MV2_-MBCbq0", note:"Watch the parts on slope, intercepts, and linear functions. You don’t need the whole video; save the systems part for tomorrow."},
  learn:[
    "**Slope-intercept form:** y = mx + b. The slope m is the rate of change (how much y changes when x goes up by 1). The y-intercept b is the value of y when x = 0, often the starting amount.",
    "**Slope from two points:** (y₂ − y₁) ÷ (x₂ − x₁).",
    "**Standard form** Ax + By = C: solve for y to see the slope, or use slope = −A/B.",
    "**Word problems:** the number attached to the variable is the rate (per hour, per mile). The number by itself is the fixed or starting amount.",
    "**Function notation:** f(3) = 19 means the point (3, 19) is on the graph.",
    "**Desmos move:** type the equation exactly as written, then click the line to see its intercepts."
  ],
  questions:[
    {id:"q1", area:"Math", skill:"Linear functions", type:"mc",
     prompt:"A plumber’s total charge is modeled by C = 75h + 60, where C is the cost in dollars for h hours of work. What does 75 represent?",
     choices:["The fixed fee charged for every job","The cost for each hour of work","The total cost of a 1-hour job","The number of hours worked"], answer:1,
     explain:"The number multiplied by h is the rate: every extra hour adds $75. The 60 is the fixed fee (the cost when h = 0), and a 1-hour job would cost 75 + 60 = $135."},
    {id:"q2", area:"Math", skill:"Linear equations in two variables", type:"num",
     prompt:"A line passes through the points (2, 5) and (6, 17). What is the slope of the line?", answer:3,
     explain:"Slope = (17 − 5) ÷ (6 − 2) = 12 ÷ 4 = 3."},
    {id:"q3", area:"Math", skill:"Linear equations in two variables", type:"mc",
     prompt:"What is the slope of the line 4x − 2y = 10?",
     choices:["−5","−2","2","4"], answer:2,
     explain:"Solve for y: −2y = −4x + 10, so y = 2x − 5. The slope is 2. (Shortcut: slope = −A/B = −4 ÷ −2 = 2.) The −5 is the y-intercept, a common trap."},
    {id:"q4", area:"Math", skill:"Linear functions", type:"mc",
     prompt:"For a linear function f, f(0) = 7 and f(3) = 19. Which equation defines f?",
     choices:["f(x) = 7x + 4","f(x) = 3x + 7","f(x) = 4x + 19","f(x) = 4x + 7"], answer:3,
     explain:"f(0) = 7 tells you the y-intercept is 7. The slope is (19 − 7) ÷ (3 − 0) = 4. So f(x) = 4x + 7."},
    {id:"q5", area:"Math", skill:"Linear equations in two variables", type:"num",
     prompt:"A phone plan costs $25 per month plus $0.10 for each text message. One month’s bill was $38. How many text messages were sent that month?", answer:130,
     explain:"25 + 0.10t = 38, so 0.10t = 13 and t = 130."},
    {id:"q6", area:"Math", skill:"Linear equations in two variables", type:"mc",
     prompt:"The table shows a linear relationship between x and y. Which equation represents it?",
     table:[["x","1","4","7"],["y","11","20","29"]],
     choices:["y = x + 10","y = 3x + 8","y = 9x + 2","y = 3x + 11"], answer:1,
     explain:"Each time x goes up by 3, y goes up by 9, so the slope is 9 ÷ 3 = 3. Using (1, 11): 11 = 3(1) + b, so b = 8. Check (4, 20): 3(4) + 8 = 20. Notice y = x + 10 works for the first point only, so always check a second point."},
    {id:"q7", area:"English", skill:"Central ideas and details", type:"mc",
     passage:"Many people assume that honeybees do most of the work of pollinating crops. However, one large study of farms on several continents found that visits from wild insects, such as solitary bees and hoverflies, increased fruit production more than the same number of honeybee visits did. The researchers suggested that farmers who rely only on managed honeybee hives may be missing important benefits from wild pollinators.",
     prompt:"Which choice best states the main idea of the text?",
     choices:["Honeybees are no longer useful to farmers.","Wild insects may play a bigger role in crop pollination than many people assume.","Hoverflies are a type of solitary bee.","Farmers should stop keeping honeybee hives."], answer:1,
     explain:"The passage sets up a common assumption (honeybees do most of the work), then gives evidence that wild insects matter a lot. A and D go too far: the text says farmers may be missing benefits, not that honeybees are useless. C misreads a detail."},
    {id:"q8", area:"English", skill:"Command of evidence", type:"mc",
     passage:"In a novel, the narrator, Inés, has just moved to a new town. A student claims that Inés distrusts her new neighbors.",
     prompt:"Which quotation from the novel would best support the student’s claim?",
     choices:["“The house on Alder Street had a blue door and a crooked mailbox.”","“Inés had never lived so close to the ocean before.”","“Each time the Parks waved from their porch, Inés found a reason to look away and hurry inside.”","“By October, the maple trees along the street had turned a brilliant red.”"], answer:2,
     explain:"Only this choice is about Inés and her neighbors, and it shows her avoiding them. The other quotations describe the setting. They may be true and vivid, but they don’t support the claim."}
  ],
  cards:[
    ["y = mx + b: what do m and b mean?","m is the slope (rate of change). b is the y-intercept: the value of y when x = 0, often the starting amount."],
    ["How do you find slope from two points?","(y₂ − y₁) ÷ (x₂ − x₁)"],
    ["Slope of Ax + By = C?","−A/B. Or just solve for y."],
    ["In C = 75h + 60, which number is the rate?","75, the number attached to the variable. 60 is the fixed or starting amount."],
    ["What does f(3) = 19 tell you?","The point (3, 19) is on the graph of f."],
    ["Parallel vs. perpendicular slopes","Parallel lines have the same slope. Perpendicular slopes are negative reciprocals, like 2/3 and −3/2."],

/* ---------- State ---------- */
const KEY = "oct3-sat-plan-v1";
function defaultState(){ return {steps:{}, qs:{}, cards:{}, retry:[], log:[], pos:{}, view:"plan", day:null}; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(p && typeof p === "object") return Object.assign(defaultState(), p); }
  }catch(e){}
  return defaultState();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function fmt(s){
  let h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\^\(([^)]+)\)/g, "<sup>$1</sup>");
  h = h.replace(/\^([0-9a-zA-Z−]+)/g, "<sup>$1</sup>");
  return h;
}
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }
function button(label, onClick, cls){ const b = el("button", "btn" + (cls ? " " + cls : ""), label); b.type = "button"; b.addEventListener("click", onClick); return b; }
function stepsOf(d){ return d.steps || STUDY_STEPS; }
function stepKey(d, i){ return d.id + ":s" + i; }
function required(d){ return stepsOf(d).map((s,i)=>({s,i})).filter(x=>!x.s.optional); }
function dayProgress(d){ const r = required(d); const done = r.filter(x=>S.steps[stepKey(d,x.i)]).length; return {done, total:r.length}; }
function dayDone(d){ const p = dayProgress(d); return p.total > 0 && p.done === p.total; }
function getDay(id){ return DAYS.find(d=>d.id===id) || DAYS[0]; }
function dayIndex(d){ return DAYS.indexOf(d); }
function localISO(dt){ const m = String(dt.getMonth()+1).padStart(2,"0"); const dd = String(dt.getDate()).padStart(2,"0"); return dt.getFullYear()+"-"+m+"-"+dd; }
const TODAY = localISO(new Date());
function defaultDay(){
  const t = DAYS.find(d=>d.date===TODAY); if(t) return t.id;
  if(TODAY < DAYS[0].date) return DAYS[0].id;
  return DAYS[DAYS.length-1].id;
}
if(!S.day) S.day = defaultDay();
const PRAISE = ["Correct.","Yes, that’s it.","Nice work.","Exactly right.","You got it."];
function praiseFor(id){ let h = 0; for(const ch of id) h = (h*31 + ch.charCodeAt(0)) % 997; return PRAISE[h % PRAISE.length]; }
function parseNum(raw){
  let s = String(raw).trim().replace(/,/g,"").replace(/−/g,"-").replace(/\s+/g,"");
  if(!s) return null;
  const m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if(m){ const a = parseFloat(m[1]), b = parseFloat(m[2]); if(!isFinite(a) || !isFinite(b) || b === 0) return null; return a/b; }
  if(!/^-?\d*\.?\d+$/.test(s)) return null;
  const v = parseFloat(s); return isFinite(v) ? v : null;
}
function findQuestion(key){
  const [did, qid] = key.split(":");
  const d = DAYS.find(x=>x.id===did); if(!d || !d.questions) return null;
  const q = d.questions.find(x=>x.id===qid); return q ? {d,q} : null;
}

/* ---------- Header ---------- */
function renderCountdown(){
  const now = new Date(); const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const test = new Date(2026, 9, 3);
  const n = Math.round((test - start) / 86400000);
  let t;
  if(n > 1) t = "<strong>" + n + " days</strong> until the SAT on Saturday, October 3. Each day has one goal and a few small steps. Check them off as you go.";
  else if(n === 1) t = "<strong>The SAT is tomorrow.</strong> Today is a light day: a short warm-up, then rest.";
  else if(n === 0) t = "<strong>Today is test day.</strong> You’ve done the work. Go show what you know.";
  else t = "The October 3 test is done. Your notes and retry list are still here if you want them for next time.";
  if(S.view === "plan" && !S.seenAbout) t += " First time here? Start with <a href=\"#\" id=\"aboutlink\">How this works</a>.";
  $("#countdown").innerHTML = t;
  const a = $("#aboutlink"); if(a) a.addEventListener("click", e=>{ e.preventDefault(); go("about"); });
}
function renderTabs(){
  const tabs = $("#tabs"); tabs.innerHTML = "";
  const items = [["plan","Daily plan"],["retry","Retry list"],["notes","My notes"],["about","How this works"]];
  items.forEach(([id,label])=>{
    const b = el("button");
    b.type = "button";
    let extra = "";
    if(id === "retry" && S.retry.length) extra = '<span class="count">' + S.retry.length + "</span>";
    if(id === "notes" && S.log.length) extra = '<span class="count">' + S.log.length + "</span>";
    b.innerHTML = esc(label) + extra;
    if(S.view === id) b.setAttribute("aria-current","page");
    b.addEventListener("click", ()=>go(id));
    tabs.append(b);
  });
}
function renderStrip(){
  const strip = $("#strip"); strip.innerHTML = "";
  DAYS.forEach((d,i)=>{
    const b = el("button","daychip" + (dayDone(d) ? " done" : ""));
    b.type = "button";

    strip.append(b);
  });

  if(cur && cur.scrollIntoView){ try{ cur.scrollIntoView({block:"nearest", inline:"nearest"}); }catch(e){} }

function go(view){ S.view = view; if(view === "about") S.seenAbout = true; save(); render(); window.scrollTo({top:0}); }

/* ---------- Day view ---------- */
let celebrateNow = false;
function renderDay(main, d){
  const idx = dayIndex(d);
  const wrap = el("div","day");
  const aside = el("aside","aside");
  aside.id = "aside";
  wrap.append(aside);
  const col = el("div","steps");
  stepsOf(d).forEach((s,i)=>col.append(renderStep(d,s,i)));
  if(d.note) col.append(el("p","daynote", fmt(d.note)));
  const nav = el("div","daynav");
  nav.append(idx > 0 ? button("Previous day", ()=>{ S.day = DAYS[idx-1].id; save(); render(); window.scrollTo({top:0}); }) : el("span"));
  nav.append(idx < DAYS.length-1 ? button("Next day", ()=>{ S.day = DAYS[idx+1].id; save(); render(); window.scrollTo({top:0}); }, "primary") : el("span"));
  col.append(nav);
  wrap.append(col);
  main.append(wrap);
  renderAside(d);
}
function renderAside(d){
  const aside = $("#aside"); if(!aside) return;
  const idx = dayIndex(d);
  const p = dayProgress(d);
  let h = "";
  if(dayDone(d)) h += '<div class="celebrate' + (celebrateNow ? " pop" : "") + '">Day ' + (idx+1) + " done. That’s real progress.</div>";
  celebrateNow = false;
  h += '<p class="when">Day ' + (idx+1) + " of 12, " + esc(d.dowLong) + ", " + esc(d.mdLong) + "</p>";
  h += "<h2>" + fmt(d.title) + "</h2>";
  h += '<p class="goal"><strong>Today’s goal:</strong> ' + fmt(d.goal) + "</p>";
  if(d.time) h += '<p class="time">' + esc(d.time) + "</p>";
  if(d.objectives && d.objectives.length){
    h += '<p class="objlabel">By the end of today, you’ll be able to:</p><ul class="objs">' + d.objectives.map(o=>"<li>" + fmt(o) + "</li>").join("") + "</ul>";
  }
  h += '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + p.total + '" aria-valuenow="' + p.done + '" aria-label="Steps done today"><span style="width:' + (p.total ? Math.round(p.done/p.total*100) : 0) + '%"></span></div>';
  h += '<p class="progtext">' + p.done + " of " + p.total + " steps done</p>";
  h += '<ul class="stepindex">' + stepsOf(d).map((s,i)=>{
    const done = !!S.steps[stepKey(d,i)];
    return '<li class="' + (done ? "isdone" : "") + '"><a href="#step-' + i + '"><span class="mk">' + (done ? "✓" : "") + '</span><span class="' + (s.optional ? "opt" : "") + '">' + esc(s.title) + "</span></a></li>";
  }).join("") + "</ul>";
  aside.innerHTML = h;
}
function setStep(d, i, val){
  const wasDone = dayDone(d);
  S.steps[stepKey(d,i)] = val;
  save();
  const sec = document.getElementById("step-" + i);
  if(sec){
    sec.classList.toggle("isdone", val);
    const b = sec.querySelector(".donebtn");
    if(b){ b.setAttribute("aria-pressed", val ? "true" : "false"); b.textContent = val ? "Done ✓" : "Mark done"; }
  }
  if(!wasDone && dayDone(d)) celebrateNow = true;
  renderAside(d); renderStrip();
}
function autoDone(d, type){ const i = stepsOf(d).findIndex(s=>s.type===type); if(i >= 0 && !S.steps[stepKey(d,i)]) setStep(d, i, true); }
function renderStep(d, s, i){
  const done = !!S.steps[stepKey(d,i)];
  const sec = el("section","step" + (done ? " isdone" : "") + (s.optional ? " optional" : ""));
  sec.id = "step-" + i;
  const head = el("div","stephead");
  head.append(el("span","num", String(i+1)));
  const t = el("div","grow", "<h3>" + esc(s.title) + "</h3>" + (s.time ? '<span class="st">' + esc(s.time) + "</span>" : ""));
  head.append(t);
  const db = el("button","donebtn", done ? "Done ✓" : "Mark done");
  db.type = "button";
  db.setAttribute("aria-pressed", done ? "true" : "false");
  db.setAttribute("aria-label", (done ? "Done: " : "Mark done: ") + s.title);
  db.addEventListener("click", ()=>setStep(d, i, !S.steps[stepKey(d,i)]));
  head.append(db);
  sec.append(head);
  const body = el("div","stepbody");
  if(s.type === "video") body.append(videoBlock(d));
  else if(s.type === "learn") body.innerHTML = '<ul class="ideas">' + d.learn.map(x=>"<li>" + fmt(x) + "</li>").join("") + "</ul>";
  else if(s.type === "practice"){ const box = el("div","quiz"); renderQuiz(box, d); body.append(box); }
  else if(s.type === "cards"){ const box = el("div","cards"); renderCards(box, d); body.append(box); }
  else if(s.type === "more"){
    body.innerHTML = "<details><summary>Extra official practice from the College Board</summary><p>Open the free <a href=\"https://satsuitequestionbank.collegeboard.org/\" target=\"_blank\" rel=\"noopener\">SAT Suite Question Bank</a>. Choose SAT, then " + fmt(d.more.path) + "</p><p>" + fmt(d.more.count) + " If you see an option to exclude active questions, turn it on so you don’t use up questions from the Bluebook practice tests.</p><p class=\"small\">Only do this if you have energy left. The steps above are the important part.</p></details>";
  }
  else if(s.type === "list") body.innerHTML = '<ul class="checklist">' + s.items.map(x=>"<li>" + fmt(x) + "</li>").join("") + "</ul>";
  else if(s.type === "text") body.innerHTML = "<p>" + fmt(s.text) + "</p>";
  else if(s.type === "retry"){
    const n = S.retry.length;
    body.innerHTML = "<p>" + (n ? "You have <strong>" + n + "</strong> question" + (n === 1 ? "" : "s") + " saved from earlier practice. Try each one again; when you get it right, clear it from the list." : "Your retry list is empty right now. If you missed questions on the practice tests, redo a few of those instead.") + "</p>";
    if(n) body.append(button("Open retry list", ()=>go("retry"), "primary"));
  }
  sec.append(body);
  return sec;
}
function videoBlock(d){
  const f = document.createDocumentFragment();
  const v = d.video;
  if(!v){ f.append(el("p","", "No video today.")); return f; }
  const a = el("a","vid", '<span class="play" aria-hidden="true">▶</span><span><strong>' + esc(v.title) + '</strong><span class="src">YouTube, opens in a new tab</span></span>');
  a.href = v.url; a.target = "_blank"; a.rel = "noopener";
  f.append(a);
  if(v.note) f.append(el("p","note", fmt(v.note)));
  if(d.bonus && d.bonus.length){
    f.append(el("p","bonus lbl","Reading videos for later today (optional):"));
    const ul = el("ul","bonus");
    d.bonus.forEach(b=>{ const li = el("li"); const a2 = el("a","", esc(b.title)); a2.href = b.url; a2.target = "_blank"; a2.rel = "noopener"; li.append(a2); ul.append(li); });
    f.append(ul);
  }
  return f;
}

/* ---------- Questions ---------- */
function questionBody(q, rec, onAnswer, saveNote){
  const wrap = el("div","qbody");
  if(q.passage) wrap.append(el("div","passage", fmt(q.passage)));
  if(q.table){
    const tw = el("div","tablewrap");
    let h = '<table class="qt"><thead><tr>' + q.table[0].map(c=>"<th scope=\"col\">" + fmt(c) + "</th>").join("") + "</tr></thead><tbody>";
    q.table.slice(1).forEach(r=>{ h += "<tr>" + r.map((c,j)=> j === 0 ? "<th scope=\"row\">" + fmt(c) + "</th>" : "<td>" + fmt(c) + "</td>").join("") + "</tr>"; });
    tw.innerHTML = h + "</tbody></table>";
    wrap.append(tw);
  }
  wrap.append(el("p","prompt", fmt(q.prompt)));
  if(q.type === "mc"){
    q.choices.forEach((c,i)=>{
      const b = el("button","choice", '<span class="letter">' + "ABCD"[i] + "</span><span>" + fmt(c) + "</span>");
      b.type = "button";
      if(rec){
        b.disabled = true;
        if(i === q.answer) b.classList.add("right");
        else if(i === rec.choice) b.classList.add("wrong");
      } else {
        b.addEventListener("click", ()=>onAnswer({choice:i, correct: i === q.answer}));
      }
      wrap.append(b);
    });
  } else {
    const row = el("div","numrow");
    const inp = el("input");
    inp.type = "text"; inp.setAttribute("inputmode","decimal"); inp.setAttribute("aria-label","Your answer"); inp.placeholder = "Type your answer";
    const hint = el("p","hint");
    hint.setAttribute("aria-live","polite");
    const chk = button("Check", ()=>{
      const v = parseNum(inp.value);
      if(v === null){ hint.textContent = "Type a number, like 4, 0.6, or 3/5."; return; }
      onAnswer({value: inp.value.trim(), correct: Math.abs(v - q.answer) < 1e-6});
    }, "primary");
    inp.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); chk.click(); } });
    if(rec){ inp.value = rec.value || ""; inp.disabled = true; chk.disabled = true; }
    row.append(inp, chk);
    wrap.append(row, hint);
  }
  if(rec){
    const fb = el("div","fb " + (rec.correct ? "right" : "wrong"));
    fb.setAttribute("aria-live","polite");
    let lead;
    if(rec.correct) lead = praiseFor(q.id);
    else lead = "Not quite. The answer is " + (q.type === "mc" ? "ABCD"[q.answer] : String(q.answer)) + ".";
    fb.innerHTML = "<strong>" + esc(lead) + "</strong> " + fmt(q.explain) + (!rec.correct && saveNote ? '<span class="saved">Saved to your retry list so you can try it again later.</span>' : "");
    wrap.append(fb);
  }
  return wrap;
}
function renderQuiz(box, d){
  box.innerHTML = "";
  const qs = d.questions || [];
  const n = qs.length;
  if(!n){ box.append(el("p","","No questions today.")); return; }
  let pos = S.pos[d.id] || 0;
  if(pos >= n){ renderSummary(box, d); return; }
  const q = qs[pos];
  const key = d.id + ":" + q.id;
  const rec = S.qs[key];
  box.append(el("div","qhead", "<span>Question " + (pos+1) + " of " + n + '</span><span class="tag' + (q.area === "English" ? " eng" : "") + '">' + esc(q.area === "English" ? "Reading: " + q.skill : q.skill) + "</span>"));
  const dots = el("div","dots");
  qs.forEach((qq,i)=>{
    const r = S.qs[d.id + ":" + qq.id];
    const dot = el("button","dot" + (i === pos ? " cur" : "") + (r ? (r.correct ? " ok" : " no") : ""));
    dot.type = "button";
    dot.setAttribute("aria-label","Go to question " + (i+1) + (r ? (r.correct ? ", correct" : ", missed") : ""));
    dot.addEventListener("click", ()=>{ S.pos[d.id] = i; save(); renderQuiz(box, d); });
    dots.append(dot);
  });
  box.append(dots);
  box.append(questionBody(q, rec, result=>{
    S.qs[key] = result;
    if(!result.correct && !S.retry.includes(key)) S.retry.push(key);
    save(); renderQuiz(box, d); renderTabs();
  }, true));
  const nav = el("div","qnav");
  if(pos > 0) nav.append(button("Previous", ()=>{ S.pos[d.id] = pos-1; save(); renderQuiz(box, d); }));
  if(rec) nav.append(button(pos === n-1 ? "See how you did" : "Next question", ()=>{
    S.pos[d.id] = pos+1; save();
    if(pos === n-1 && qs.every(x=>S.qs[d.id + ":" + x.id])) autoDone(d, "practice");
    renderQuiz(box, d);
  }, "primary"));
  else if(pos < n-1) nav.append(button("Skip for now", ()=>{ S.pos[d.id] = pos+1; save(); renderQuiz(box, d); }));
  box.append(nav);
}
function renderSummary(box, d){
  const qs = d.questions;
  const n = qs.length;
  const answered = qs.filter(q=>S.qs[d.id + ":" + q.id]).length;
  const right = qs.filter(q=>(S.qs[d.id + ":" + q.id] || {}).correct).length;
  let msg;
  if(answered < n) msg = "You skipped " + (n - answered) + " question" + (n - answered === 1 ? "" : "s") + ". Use the dots above to jump back whenever you’re ready.";
  else if(right === n) msg = "Every single one. This topic is in good shape.";
  else if(right >= n/2) msg = "Solid work. The ones you missed are saved in your retry list. Coming back to them later this week is exactly how they turn into points.";
  else msg = "This is new ground, and that’s what today was for. Your misses are saved in your retry list, and a second look usually makes things click.";
  const dots = el("div","dots");
  qs.forEach((qq,i)=>{
    const r = S.qs[d.id + ":" + qq.id];
    const dot = el("button","dot" + (r ? (r.correct ? " ok" : " no") : ""));
    dot.type = "button";
    dot.setAttribute("aria-label","Go to question " + (i+1));
    dot.addEventListener("click", ()=>{ S.pos[d.id] = i; save(); renderQuiz(box, d); });
    dots.append(dot);
  });
  box.append(dots);
  box.append(el("div","summary", '<p class="big">' + right + " of " + n + " correct</p><p>" + esc(msg) + "</p>"));
  const nav = el("div","qnav");
  nav.append(button("Look back at the questions", ()=>{ S.pos[d.id] = 0; save(); renderQuiz(box, d); }));
  nav.append(button("Redo these questions", ()=>{ qs.forEach(q=>{ delete S.qs[d.id + ":" + q.id]; }); S.pos[d.id] = 0; save(); renderQuiz(box, d); }));
  if(right < answered) nav.append(button("Open retry list", ()=>go("retry"), "primary"));
  box.append(nav);
}

/* ---------- Flashcards ---------- */
const cardPos = {}, cardFlip = {}, cardOnlyLearning = {}, deckOrder = {};
function allCards(){ return DAYS.flatMap(dd => Array.isArray(dd.cards) ? dd.cards.map((c,i)=>({key: dd.id + ":c" + i, front:c[0], back:c[1]})) : []); }
function shuffle(a){ const b = a.slice(); for(let i = b.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function baseDeck(d){
  if(d.cards === "ALL") return allCards();
  if(d.cards === "LEARNING"){ const l = allCards().filter(c=>S.cards[c.key] === "learning"); return l.length ? l : allCards(); }
  return (d.cards || []).map((c,i)=>({key: d.id + ":c" + i, front:c[0], back:c[1]}));
}
function renderCards(box, d){
  box.innerHTML = "";
  let deck = baseDeck(d);
  if(!deck.length){ box.append(el("p","","No flashcards today.")); return; }
  if(d.cards === "ALL" || d.cards === "LEARNING"){
    if(!deckOrder[d.id] || deckOrder[d.id].length !== deck.length) deckOrder[d.id] = shuffle(deck.map(c=>c.key));
  }
  if(deckOrder[d.id]){ const m = {}; deck.forEach(c=>{ m[c.key] = c; }); deck = deckOrder[d.id].map(k=>m[k]).filter(Boolean); }
  let note = "";
  if(d.cards === "LEARNING" && !allCards().some(c=>S.cards[c.key] === "learning")) note = "You haven’t marked any cards as “still learning,” so here’s the full deck.";
  if(cardOnlyLearning[d.id]){
    const f = deck.filter(c=>S.cards[c.key] !== "known");
    if(f.length) deck = f; else { cardOnlyLearning[d.id] = false; note = "You’ve marked every card as “got it.” Nice. Showing the full deck again."; }
  }
  const all = baseDeck(d);
  const known = all.filter(c=>S.cards[c.key] === "known").length;
  let i = cardPos[d.id] || 0; if(i >= deck.length) i = 0; cardPos[d.id] = i;
  const c = deck[i];
  const flipped = !!cardFlip[d.id];
  if(note) box.append(el("p","small", esc(note)));
  box.append(el("p","fcmeta", "Card " + (i+1) + " of " + deck.length + ". Marked “got it”: " + known + " of " + all.length + "."));
  const card = el("button","fc" + (flipped ? " flipped" : ""));
  card.type = "button";
  card.setAttribute("aria-label", (flipped ? "Answer: " + c.back : "Question: " + c.front) + ". Press to flip.");
  card.innerHTML = '<span class="face front"><span class="side">Question</span><span>' + fmt(c.front) + '</span></span><span class="face back"><span class="side">Answer</span><span>' + fmt(c.back) + "</span></span>";
  card.addEventListener("click", ()=>{ cardFlip[d.id] = !cardFlip[d.id]; renderCards(box, d); const nb = box.querySelector(".fc"); if(nb) nb.focus(); });
  box.append(card);
  box.append(el("p","fchint", "Tap the card to flip it. Then choose how well you knew it."));
  const ctl = el("div","fcctl");
  ctl.append(button("Previous", ()=>{ cardPos[d.id] = (i - 1 + deck.length) % deck.length; cardFlip[d.id] = false; renderCards(box, d); }));
  const rate = (val)=>{
    S.cards[c.key] = val; save();
    cardFlip[d.id] = false;
    cardPos[d.id] = (i + 1) % deck.length;
    if(baseDeck(d).every(x=>S.cards[x.key])) autoDone(d, "cards");
    renderCards(box, d);
  };
  const l = button("Still learning", ()=>rate("learning"), "learn");
  const k = button("Got it", ()=>rate("known"), "know");
  ctl.append(l, k);
  ctl.append(button("Next", ()=>{ cardPos[d.id] = (i + 1) % deck.length; cardFlip[d.id] = false; renderCards(box, d); }));
  box.append(ctl);
  const opts = el("div","fcopts");
  const lab = el("label");
  const cb = el("input"); cb.type = "checkbox"; cb.checked = !!cardOnlyLearning[d.id];
  cb.addEventListener("change", ()=>{ cardOnlyLearning[d.id] = cb.checked; cardPos[d.id] = 0; cardFlip[d.id] = false; renderCards(box, d); });
  lab.append(cb, document.createTextNode("Only show cards I haven’t marked “got it”"));
  opts.append(lab);
  opts.append(button("Shuffle", ()=>{ deckOrder[d.id] = shuffle(baseDeck(d).map(x=>x.key)); cardPos[d.id] = 0; cardFlip[d.id] = false; renderCards(box, d); }));
  box.append(opts);
}

/* ---------- Retry list ---------- */
const retryTry = {};
function renderRetry(main){
  const page = el("div","page");
  page.append(el("h2","","Retry list"));
  page.append(el("p","","Questions you miss in the daily practice are saved here. Try them again. When you get one right, you can clear it."));
  const valid = S.retry.filter(k=>findQuestion(k));
  if(valid.length !== S.retry.length){ S.retry = valid; save(); }
  if(!valid.length){
    page.append(el("div","empty","<p><strong>Nothing here yet.</strong></p><p>When you miss a practice question, it shows up here so you can come back to it. Missing questions is part of learning, not a problem.</p>"));
    main.append(page); return;
  }
  valid.forEach(key=>{
    const {d, q} = findQuestion(key);
    const card = el("div","retrycard");
    const draw = ()=>{
      card.innerHTML = "";
      card.append(el("p","from", "From Day " + (dayIndex(d)+1) + " (" + esc(d.tab) + "), " + esc(q.skill)));
      const rec = retryTry[key];
      card.append(questionBody(q, rec, result=>{ retryTry[key] = result; draw(); }, false));
      const nav = el("div","qnav");
      if(rec && rec.correct) nav.append(button("Clear from list", ()=>{ S.retry = S.retry.filter(k=>k !== key); delete retryTry[key]; save(); render(); }, "primary"));
      if(rec && !rec.correct) nav.append(button("Try again", ()=>{ delete retryTry[key]; draw(); }));
      if(rec) card.append(nav);
    };
    draw();
    page.append(card);
  });
  main.append(page);
}

/* ---------- Notes ---------- */
const WHY = ["I didn’t know how to do it","I misread the question","Careless mistake","Ran out of time","Other"];
function renderNotes(main){
  const page = el("div","page");
  page.append(el("h2","","My notes"));
  page.append(el("p","","After a practice test, jot down each miss here. It takes about 30 seconds per question, and it’s the fastest way to see what to focus on."));
  if(S.log.length){
    const byWhy = {}; const byTopic = {};
    S.log.forEach(n=>{ byWhy[n.why] = (byWhy[n.why] || 0) + 1; const t = (n.topic || "Other").trim(); byTopic[t] = (byTopic[t] || 0) + 1; });
    const topW = Object.entries(byWhy).sort((a,b)=>b[1]-a[1])[0];
    const topT = Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).slice(0,2);
    page.append(el("div","pattern", "<strong>Patterns so far:</strong> most common topic" + (topT.length > 1 ? "s" : "") + ": " + topT.map(t=>esc(t[0]) + " (" + t[1] + ")").join(", ") + ". Most common reason: " + esc(topW[0]) + " (" + topW[1] + ")."));
  }
  const form = el("form","noteform");
  const topics = Array.from(new Set(DAYS.flatMap(d=>(d.questions || []).map(q=>q.skill)))).concat(["Boundaries (punctuation)","Form, structure, and sense (grammar)","Inferences","Words in context","Transitions","Rhetorical synthesis"]);
  form.innerHTML =
    '<label>Topic<input name="topic" list="topiclist" placeholder="For example: Systems of linear equations" required></label>' +
    '<datalist id="topiclist">' + topics.map(t=>'<option value="' + esc(t) + '">').join("") + "</datalist>" +
    '<label>What happened?<select name="why">' + WHY.map(w=>"<option>" + esc(w) + "</option>").join("") + "</select></label>" +
    '<label>What I’ll remember next time<textarea name="rule" placeholder="For example: for no solution, the slopes match but the intercepts don’t."></textarea></label>' +
    '<div><button class="btn primary" type="submit">Save note</button></div>';
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const topic = String(fd.get("topic") || "").trim();
    if(!topic) return;
    S.log.unshift({id: Date.now().toString(36), date: TODAY, topic, why: String(fd.get("why")), rule: String(fd.get("rule") || "").trim()});
    save(); render();
    const t = document.querySelector('form.noteform input[name="topic"]'); if(t) t.focus();
  });
  page.append(form);
  if(!S.log.length) page.append(el("p","small","No notes yet. They’ll show up here, newest first."));
  S.log.forEach(n=>{
    const it = el("div","noteitem");
    it.innerHTML = '<div class="nt">' + esc(n.topic) + '</div><div class="nm">' + esc(n.why) + ", " + esc(n.date) + "</div>" + (n.rule ? "<p>" + esc(n.rule) + "</p>" : "");
    const del = el("button","linkbtn","Delete");
    del.type = "button";
    del.addEventListener("click", ()=>{ S.log = S.log.filter(x=>x.id !== n.id); save(); render(); });
    it.append(del);
    page.append(it);
  });
  main.append(page);
}

/* ---------- About ---------- */
function renderAbout(main){
  const page = el("div","page");
  page.innerHTML =
    "<h2>How this plan works</h2>" +
    "<p>Each day has <strong>one goal</strong> and a few small steps: watch a short video, read the key ideas, try some practice questions, and review flashcards. Check off each step as you go. Most days take about an hour.</p>" +
    "<p>You don’t have to do every day perfectly. If a day gets away from you, just pick up with the next one.</p>" +
    "<h3>Where you’re starting</h3>" +
    '<div class="scores"><div class="score"><div class="v">680 / 750</div><div class="l">Reading and Writing (official / practice test)</div></div><div class="score"><div class="v">610</div><div class="l">Math (official)</div></div></div>' +
    "<p>Your reading is already in good shape; that 750 shows what you can do. Math is where the most points are waiting, which is why most of this plan is math.</p>" +
    "<h3>Why this order</h3>" +
    "<p>Most SAT math questions come from two areas: Algebra (lines and systems) and Advanced Math (expressions, quadratics, and exponentials). The first days cover those, because that’s where practice pays off the most. Geometry, trigonometry, and area and volume come later in the week. Reading gets a couple of questions most days to stay sharp.</p>" +
    "<h3>What counts as progress</h3>" +
    "<p>Getting questions wrong in practice is how this works. Every miss is saved to your <strong>Retry list</strong>, and fixing those is where points come from. After practice tests, jot your misses in <strong>My notes</strong> so patterns jump out.</p>" +
    "<h3>Free tools you’ll use</h3>" +
    '<ul class="checklist">' +
    '<li><a href="https://bluebook.collegeboard.org/" target="_blank" rel="noopener">Bluebook</a>: the official app for full practice tests (and the real test).</li>' +
    '<li><a href="https://satsuitequestionbank.collegeboard.org/" target="_blank" rel="noopener">SAT Suite Question Bank</a>: official practice questions you can filter by topic and difficulty.</li>' +
    '<li><a href="https://www.khanacademy.org/test-prep/v2-sat-math" target="_blank" rel="noopener">Khan Academy SAT Math</a>: free lessons and practice from the College Board’s official partner.</li>' +
    '<li><a href="https://www.desmos.com/calculator" target="_blank" rel="noopener">Desmos</a>: the same graphing calculator that’s built into the test. Practice with it here.</li>' +
    "</ul>" +
    '<p class="small">Your checkmarks, answers, and notes save in this browser on this device.</p>';
  page.append(button("Go to today’s plan", ()=>{ S.day = defaultDay(); go("plan"); }, "primary"));
  main.append(page);
}

/* ---------- Render ---------- */
function render(){
  renderCountdown();
  renderTabs();
  renderStrip();
  const main = $("#main");
  main.innerHTML = "";
  if(S.view === "retry") renderRetry(main);
  else if(S.view === "notes") renderNotes(main);
  else if(S.view === "about") renderAbout(main);
  else { S.view = "plan"; renderDay(main, getDay(S.day)); }
}
render();
</script>
</body>
